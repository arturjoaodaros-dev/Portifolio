name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # O .env não é versionado: o CI recebe a URL por aqui (ou pela variável SITE_URL do repositório).
  VITE_SITE_URL: ${{ vars.SITE_URL || 'https://arturdaros.is-a.dev' }}

jobs:
  verify:
    name: Lint, build e verificação do dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Lighthouse CI (limites em lighthouserc.json)
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 14

# CD: a Vercel (ou Netlify) publica sozinha a cada push na main e cria um preview por pull request.
# Não há segredos nem deploy manual neste workflow. Ver docs/deployment.md.
